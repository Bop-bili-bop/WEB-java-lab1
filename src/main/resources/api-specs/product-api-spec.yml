openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace Product API
  version: 1.0.0
  description: API contract for CRUD operations over marketplace products.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Products
    description: Product catalog operations
paths:
  /api/products:
    get:
      tags:
        - Products
      summary: Get paged products
      operationId: getProducts
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page number.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Paged product list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Products
      summary: Create a product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product was created.
          headers:
            Location:
              description: URI of the created product.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      operationId: getProductById
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          $ref: '#/components/responses/NotFoundError'
    put:
      tags:
        - Products
      summary: Update a product
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
    delete:
      tags:
        - Products
      summary: Delete a product
      operationId: deleteProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '204':
          description: Product was deleted.
        '404':
          $ref: '#/components/responses/NotFoundError'
components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product identifier.
      schema:
        type: string
        minLength: 1
      example: prd-star-yarn
  responses:
    ValidationError:
      description: Validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://cosmo-cats.market/errors/validation
            title: Validation failed
            status: 400
            detail: Field 'price' must be greater than or equal to 0.01.
            instance: /api/products
    NotFoundError:
      description: Product was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://cosmo-cats.market/errors/not-found
            title: Product not found
            status: 404
            detail: Product 'prd-missing' was not found.
            instance: /api/products/prd-missing
  schemas:
    ProductRequest:
      type: object
      required:
        - name
        - description
        - price
        - categoryId
        - sellerEmail
        - stockQuantity
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          description: Product name. Must contain a cosmic term such as star, galaxy, comet, nebula, cosmic, lunar, orbit, asteroid, or meteor.
          example: Star Antigravity Yarn
        description:
          type: string
          minLength: 10
          maxLength: 1000
          example: Self-floating yarn ball for zero-gravity cat lounges.
        price:
          type: number
          format: decimal
          minimum: 0.01
          exclusiveMinimum: false
          example: 29.99
        categoryId:
          type: string
          minLength: 1
          example: cat-toys
        sellerEmail:
          type: string
          format: email
          example: vendor@cosmo-cats.market
        stockQuantity:
          type: integer
          minimum: 0
          example: 42
    ProductResponse:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: string
              example: prd-star-yarn
        - $ref: '#/components/schemas/ProductRequest'
    ProductPage:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
          minimum: 0
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          example: 10
        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 3
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
